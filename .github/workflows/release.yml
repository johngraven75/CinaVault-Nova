name: CinaVault-Nova Windows Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    name: Build Windows installers and publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CinaVault-Nova ${{ github.ref_name }}"
          releaseBody: |
            CinaVault-Nova — independent rewrite, v0.1.0 scaffold.
            See FEATURE_PARITY.md in this repo for what is implemented,
            scaffolded, and planned. Installers in this release are
            unsigned until code-signing secrets exist.
          releaseDraft: false
          prerelease: false
