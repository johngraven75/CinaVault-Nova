[package]
name = "cinavault-nova"
version = "0.2.2"
edition = "2021"
description = "CinaVault-Nova — Tauri 2 shell for the shared Rust core"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cinavault-core = { path = "../cinavault-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
ureq = { version = "2", features = ["json"] }
